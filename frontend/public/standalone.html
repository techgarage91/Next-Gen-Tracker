<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TechGarage — Repair Shop OS (Standalone)</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#050505;--surface:#0A0A0C;--s2:#121216;--line:#1E1E24;--txt:#fff;--t2:#A1A1AA;--t3:#52525B;--cyan:#00F0FF;--volt:#CCFF00;--ok:#00FF66;--warn:#FFB800;--err:#FF2A2A}
*{box-sizing:border-box;margin:0;padding:0;border-color:var(--line)}
body{background:var(--bg);color:var(--txt);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
.disp{font-family:'Unbounded',sans-serif}.mono{font-family:'JetBrains Mono',monospace}
::selection{background:var(--cyan);color:#000}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#26262e}::-webkit-scrollbar-thumb:hover{background:var(--cyan)}
input,select,textarea{color-scheme:dark}
a{color:inherit;text-decoration:none}
.wrap{display:flex;min-height:100vh}
/* sidebar */
.side{width:250px;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;background:var(--surface);z-index:40}
.brand{height:64px;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid var(--line);font-family:'Unbounded';font-weight:800}
.logo{height:32px;width:32px;display:grid;place-items:center;background:var(--cyan);color:#000;border-radius:2px}
.shopbox{padding:16px 18px;border-bottom:1px solid var(--line)}
.nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.navi{display:flex;align-items:center;gap:12px;padding:10px 12px;font-family:'JetBrains Mono';font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);border-left:2px solid transparent;cursor:pointer}
.navi:hover{background:var(--s2);color:#fff}
.navi.active{background:var(--s2);color:var(--cyan);border-left-color:var(--cyan)}
.footbtn{padding:10px;border-top:1px solid var(--line)}
/* main */
.main{flex:1;margin-left:250px;min-width:0}
.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:rgba(5,5,5,.75);backdrop-filter:blur(14px);z-index:30}
.content{padding:28px}
.badge{display:inline-block;border:1px solid;padding:2px 8px;font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.b-ok{border-color:var(--ok);color:var(--ok)}.b-warn{border-color:var(--warn);color:var(--warn)}.b-err{border-color:var(--err);color:var(--err)}.b-mut{border-color:var(--t3);color:var(--t2)}.b-volt{border-color:var(--volt);color:var(--volt)}.b-cyan{border-color:var(--cyan);color:var(--cyan)}
.over{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--volt)}
h1.pg{font-family:'Unbounded';font-weight:900;font-size:30px;letter-spacing:-.02em;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;border:1px solid;transition:.15s;background:transparent}
.btn-p{background:var(--cyan);color:#000;border-color:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.3)}
.btn-p:hover{background:#4DFFFF}
.btn-v{background:var(--volt);color:#000;border-color:var(--volt)}
.btn-s{color:#fff;border-color:var(--line);font-family:'JetBrains Mono'}.btn-s:hover{border-color:var(--volt);color:var(--volt)}
.btn-g{color:var(--t2);border-color:transparent}.btn-g:hover{color:#fff;background:var(--s2)}
.btn-d{color:var(--err);border-color:rgba(255,42,42,.4)}.btn-d:hover{background:var(--err);color:#000}
.card{background:var(--surface);border:1px solid var(--line);padding:22px}
.grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--surface);padding:18px}
.kpi .v{font-family:'JetBrains Mono';font-size:26px;font-weight:700;margin-top:10px}
.kpi .l{font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-top:4px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);border-bottom:1px solid var(--line);padding:14px}
td{padding:14px;font-family:'JetBrains Mono';font-size:13px;color:var(--t2);border-bottom:1px solid rgba(30,30,36,.5)}
tr.row{cursor:pointer}tr.row:hover td{background:rgba(18,18,22,.5)}
label{display:block;font-family:'JetBrains Mono';font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--t2);margin-bottom:6px;margin-top:2px}
.inp{width:100%;background:var(--bg);border:none;border-bottom:2px solid var(--line);padding:10px 4px;color:#fff;font-family:'JetBrains Mono';font-size:13px;outline:none;transition:.15s}
.inp:focus{border-color:var(--cyan)}
select.inp{border:2px solid var(--line);padding:9px 6px}
textarea.inp{border:1px solid var(--line);padding:10px}
.field{margin-bottom:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px}
.modal{background:var(--surface);border:1px solid var(--line);width:100%;max-width:560px;margin:16px 0}
.modal.wide{max-width:820px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.mhead h3{font-family:'Unbounded';font-size:18px}
.mbody{padding:22px;max-height:74vh;overflow-y:auto}
.x{cursor:pointer;color:var(--t3);font-size:22px;line-height:1}.x:hover{color:var(--cyan)}
.sec{font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--cyan);border-bottom:1px solid var(--line);padding-bottom:8px;margin:22px 0 14px}
.tags{border:1px solid var(--line);background:var(--bg);padding:8px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--line);color:var(--cyan);padding:2px 8px;font-family:'JetBrains Mono';font-size:12px;margin:2px}
.tag b{cursor:pointer}
.opt{padding:5px 8px;font-family:'JetBrains Mono';font-size:12px;color:var(--t2);cursor:pointer}.opt:hover{background:var(--s2);color:var(--cyan)}
.chip{padding:5px 12px;font-family:'JetBrains Mono';font-size:12px;border:1px solid var(--line);color:var(--t3);cursor:pointer;background:transparent}
.chip.on{border-color:var(--cyan);color:var(--cyan)}
.bar{height:8px;background:var(--cyan)}
.toast{position:fixed;top:20px;right:20px;background:var(--s2);border:1px solid var(--line);padding:12px 18px;font-family:'JetBrains Mono';font-size:13px;z-index:200;color:#fff}
.toast.ok{border-color:var(--ok)}.toast.err{border-color:var(--err);color:var(--err)}
.hide{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--bg)}
.gridbg{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px}
@media(max-width:820px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin-left:0}.row2,.row3{grid-template-columns:1fr}.menu{display:block!important}}
.menu{display:none;cursor:pointer}
@media print{body *{visibility:hidden}#ticket,#ticket *{visibility:visible}#ticket{position:absolute;inset:0;background:#fff;color:#000;padding:24px}}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="login" class="login gridbg">
  <div class="card" style="width:360px;text-align:center">
    <div class="brand" style="border:none;justify-content:center;height:auto;margin-bottom:8px">
      <span class="logo">🔧</span><span>TECH<span style="color:var(--cyan)">GARAGE</span></span>
    </div>
    <div class="over">// Standalone Edition</div>
    <p style="color:var(--t2);font-size:13px;margin:14px 0 20px">Your data is stored privately in this browser. No account needed.</p>
    <button class="btn btn-p" style="width:100%;justify-content:center" onclick="enterApp()">Enter Workshop →</button>
    <p class="mono" style="color:var(--t3);font-size:11px;margin-top:14px">Tip: use "Backup" in Settings to export your data.</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="wrap hide">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">🔧</span><span>TECH<span style="color:var(--cyan)">GARAGE</span></span></div>
    <div class="shopbox">
      <div class="mono" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)">Shop</div>
      <div class="disp" id="sideShop" style="font-weight:600">My Shop</div>
      <span class="badge b-volt" style="margin-top:8px">standalone</span>
    </div>
    <nav class="nav">
      <div class="navi active" data-page="dash" onclick="go('dash')">📊 Dashboard</div>
      <div class="navi" data-page="jobs" onclick="go('jobs')">🔧 Repair Jobs</div>
      <div class="navi" data-page="inv" onclick="go('inv')">📦 Inventory</div>
      <div class="navi" data-page="set" onclick="go('set')">⚙️ Settings</div>
    </nav>
    <div class="footbtn"><div class="navi" style="color:var(--err)" onclick="if(confirm('Exit to lock screen?')){document.getElementById('app').classList.add('hide');document.getElementById('login').classList.remove('hide')}">⎋ Lock</div></div>
  </aside>

  <div class="main">
    <div class="top">
      <span class="menu" onclick="document.getElementById('side').classList.toggle('open')" style="font-size:22px">☰</span>
      <span class="mono" id="today" style="font-size:12px;color:var(--t3);text-transform:uppercase;letter-spacing:.1em"></span>
      <span class="mono" style="font-size:12px;color:var(--t2)">Standalone Mode</span>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============ DATA LAYER (localStorage) ============ */
const LS = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))
};
const BM_DEFAULT={
 "Apple":["iPhone 16 Pro Max","iPhone 16 Pro","iPhone 16","iPhone 15 Pro Max","iPhone 15 Pro","iPhone 15","iPhone 14 Pro Max","iPhone 14 Pro","iPhone 14","iPhone 13","iPhone 12","iPhone 11","iPhone SE (3rd Gen)"],
 "Samsung":["Galaxy S25 Ultra","Galaxy S25","Galaxy S24 Ultra","Galaxy S24","Galaxy S23 Ultra","Galaxy Z Fold 6","Galaxy Z Flip 6","Galaxy A55","Galaxy A35","Galaxy M35"],
 "OnePlus":["13","12R","12","11R","11","Nord 4","Nord 3","10 Pro","9 Pro"],
 "Xiaomi":["15 Pro","15","14 Ultra","14","13 Pro","12","11 Lite"],
 "Redmi":["Note 14 Pro+","Note 14 Pro","Note 14","Note 13 Pro","Note 13","13C","12C"],
 "Realme":["14 Pro+","13 Pro","12 Pro+","11 Pro+","GT 6","C67","C55"],
 "Oppo":["Find X8 Pro","Reno 13 Pro","Reno 12","F27 Pro+","A79","A38"],
 "Vivo":["X200 Pro","X100 Pro","V40 Pro","V30 Pro","T3 Pro","Y200"],
 "Motorola":["Edge 60 Pro","Edge 50 Pro","G85","G64","Razr 50 Ultra"],
 "Google":["Pixel 9 Pro XL","Pixel 9 Pro","Pixel 9","Pixel 8a","Pixel 8 Pro","Pixel 7a"],
 "Nokia":["G42","G22","C32","XR21"],"POCO":["F7 Ultra","F6 Pro","X7 Pro","X6 Pro","M7 Pro","C75"]
};
const PROBS_DEFAULT=["Screen Cracked / Broken","Screen Not Displaying","Touch Not Working","Battery Draining Fast","Battery Not Charging","Charging Port Damaged","Speaker Not Working","Microphone Issue","Front Camera Not Working","Rear Camera Not Working","Back Glass Broken","Water / Liquid Damage","Phone Not Turning On","Boot Loop","Software Crash","Power Button Not Working","Fingerprint Sensor Issue","Face ID Not Working","Wi-Fi Not Working","Overheating","No Sound","SIM Not Detected"];
const PARTS_DEFAULT=["Display / Screen Replacement","Touch Glass Replacement","Battery Replacement","Charging Port Replacement","Speaker Replacement","Microphone Replacement","Front Camera Replacement","Rear Camera Replacement","Back Glass Replacement","Frame / Housing Replacement","Power Button Flex Replacement","Fingerprint Sensor Repair","Face ID Repair","SIM Tray Replacement","Motherboard Repair","Water Damage Cleaning","Software Flashing"];
const CURRENCIES={INR:"₹",USD:"$",EUR:"€",GBP:"£",AED:"د.إ",PKR:"₨",NGN:"₦",ZAR:"R",AUD:"A$",CAD:"C$"};

let jobs = LS.get('sg_jobs', []);
let products = LS.get('sg_products', []);
let cat = LS.get('sg_catalog', {bm:BM_DEFAULT, probs:PROBS_DEFAULT, parts:PARTS_DEFAULT});
let shop = LS.get('sg_shop', {name:"Tech Garage", tagline:"Mobile & Tablet Repair", address:"", phone:"", currency:"INR", footer:"Please keep this receipt safe to collect your device.", wa:"Hi {CUSTOMER}, your {DEVICE} (job #{JOB}) is ready for pickup. Amount: {CUR}{ESTIMATE}. - {SHOP}"});

function save(){LS.set('sg_jobs',jobs);LS.set('sg_products',products);LS.set('sg_catalog',cat);LS.set('sg_shop',shop)}
function cur(){return CURRENCIES[shop.currency]||shop.currency}
function money(n){return cur()+Number(n||0).toLocaleString('en-IN')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* seed sample data on first ever run */
if(!LS.get('sg_seeded')){
  const names=["Rahul Sharma","Priya Nair","Arjun Mehta","Sneha Patel","Vikram Singh","Ananya Rao","Karthik Iyer","Rohan Gupta"];
  const brs=[["Apple","iPhone 14 Pro"],["Samsung","Galaxy S24 Ultra"],["OnePlus","12R"],["Xiaomi","14"],["Realme","13 Pro"],["Vivo","V40 Pro"]];
  for(let i=1;i<=24;i++){const [b,m]=brs[Math.floor(Math.random()*brs.length)];const st=Math.random()>.3?"Done":(Math.random()>.5?"Pending":"Returned");const est=[1200,2500,3200,4500,5500,7800,9500][Math.floor(Math.random()*7)];const d=new Date(Date.now()-Math.floor(Math.random()*18)*864e5).toISOString();
    jobs.push({id:uid(),job_no:String(i),customer:names[Math.floor(Math.random()*names.length)],contacts:["+9198"+Math.floor(10000000+Math.random()*8e7)],imei:String(Math.floor(1e14+Math.random()*9e14)),brand:b,model:m,lock_type:"Nil",lock_value:"",sim:["SIM 1"],problems:[PROBS_DEFAULT[i%PROBS_DEFAULT.length]],parts:[PARTS_DEFAULT[i%PARTS_DEFAULT.length]],estimate:est,advance:0,parts_cost:Math.round(est*.5),payment:st==="Done"&&Math.random()>.3?"Paid":"Unpaid",method:"Cash",status:st,ready_by:"",assigned:"Self",notes:"",created:d,updated:d});}
  products=[{id:uid(),barcode:"890100001",name:"iPhone 14 Pro OLED Display",category:"Display",stock:8,cost:4500,price:6500,low:3},
  {id:uid(),barcode:"890100002",name:"Samsung S24 Battery",category:"Battery",stock:2,cost:900,price:1600,low:3},
  {id:uid(),barcode:"890100003",name:"Type-C Charging Port Flex",category:"Parts",stock:25,cost:120,price:350,low:5},
  {id:uid(),barcode:"890100005",name:"Tempered Glass (Universal)",category:"Accessories",stock:140,cost:15,price:99,low:20}];
  LS.set('sg_seeded',1); save();
}

/* ============ UI HELPERS ============ */
function toast(msg,type){const r=document.getElementById('toastRoot');const el=document.createElement('div');el.className='toast '+(type||'ok');el.textContent=msg;r.appendChild(el);setTimeout(()=>el.remove(),2600)}
function statusBadge(s){const m={Done:'b-ok',Pending:'b-warn',Returned:'b-mut',Paid:'b-ok',Unpaid:'b-err'};return `<span class="badge ${m[s]||'b-mut'}">${esc(s)}</span>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function modal(title,body,wide){document.getElementById('modalRoot').innerHTML=`<div class="ov" onmousedown="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}" onmousedown="event.stopPropagation()"><div class="mhead"><h3>${title}</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody">${body}</div></div>`}

function enterApp(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');document.getElementById('sideShop').textContent=shop.name;document.getElementById('today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});go('dash')}

let page='dash';
function go(p){page=p;document.querySelectorAll('.navi[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===p));document.getElementById('side').classList.remove('open');({dash:renderDash,jobs:renderJobs,inv:renderInv,set:renderSet}[p])()}

/* ============ DASHBOARD ============ */
function renderDash(){
  const today=new Date().toISOString().slice(0,10);
  const total=jobs.length, pending=jobs.filter(j=>j.status==='Pending').length, done=jobs.filter(j=>j.status==='Done').length, unpaid=jobs.filter(j=>j.payment==='Unpaid').length;
  const todayRev=jobs.filter(j=>j.updated?.slice(0,10)===today&&j.payment==='Paid').reduce((s,j)=>s+(+j.estimate||0),0);
  const totalRev=jobs.filter(j=>j.payment==='Paid').reduce((s,j)=>s+(+j.estimate||0),0);
  // 7-day series
  let series=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);series.push({d,rev:jobs.filter(j=>j.updated?.slice(0,10)===d&&j.payment==='Paid').reduce((s,j)=>s+(+j.estimate||0),0)})}
  const maxRev=Math.max(1,...series.map(s=>s.rev));
  const brands={};jobs.forEach(j=>brands[j.brand||'Other']=(brands[j.brand||'Other']||0)+1);
  const bd=Object.entries(brands).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const recent=[...jobs].sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,6);
  const K=[['📋',total,'Total Jobs','var(--cyan)'],['⏳',pending,'Pending','var(--warn)'],['✅',done,'Completed','var(--ok)'],['⚠️',unpaid,'Unpaid','var(--err)'],['💰',money(todayRev),"Today's Rev",'var(--volt)'],['📈',money(totalRev),'Total Rev','var(--cyan)']];
  document.getElementById('view').innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px">
    <div><div class="over">// Control Room</div><h1 class="pg">Dashboard</h1></div>
    <button class="btn btn-p" onclick="go('jobs')">🔧 New Job</button>
  </div>
  <div class="grid" style="grid-template-columns:repeat(6,1fr);margin-top:24px">
    ${K.map(k=>`<div class="kpi"><div style="font-size:18px">${k[0]}</div><div class="v" style="color:${k[3]}">${k[1]}</div><div class="l">${k[2]}</div></div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px">
    <div class="card">
      <h3 class="disp" style="font-weight:600;margin-bottom:18px">Revenue · Last 7 days</h3>
      <div style="display:flex;align-items:flex-end;gap:12px;height:180px">
        ${series.map(s=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end">
          <div class="mono" style="font-size:10px;color:var(--t3)">${s.rev?money(s.rev):''}</div>
          <div class="bar" style="width:100%;height:${Math.max(3,s.rev/maxRev*140)}px"></div>
          <div class="mono" style="font-size:10px;color:var(--t3)">${s.d.slice(5)}</div></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3 class="disp" style="font-weight:600;margin-bottom:14px">Top Brands</h3>
      ${bd.length?bd.map(b=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between" class="mono" style="font-size:12px"><span style="color:var(--t2)">${esc(b[0])}</span><span>${b[1]}</span></div><div style="height:6px;background:var(--s2);margin-top:4px"><div style="height:6px;background:var(--cyan);width:${b[1]/total*100}%"></div></div></div>`).join(''):'<p class="mono" style="color:var(--t3);font-size:13px">No data yet</p>'}
    </div>
  </div>
  <div class="card" style="margin-top:20px;padding:0">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 22px"><h3 class="disp" style="font-weight:600">Recent Jobs</h3><span class="mono" style="font-size:12px;color:var(--cyan);cursor:pointer" onclick="go('jobs')">View all →</span></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Job #</th><th>Customer</th><th>Device</th><th>Status</th><th style="text-align:right">Estimate</th></tr></thead><tbody>
    ${recent.map(j=>`<tr class="row" onclick="jobDetail('${j.id}')"><td style="color:var(--cyan)">#${esc(j.job_no)}</td><td style="color:#fff">${esc(j.customer)||'—'}</td><td>${esc(j.brand)} ${esc(j.model)}</td><td>${statusBadge(j.status)}</td><td style="text-align:right;color:#fff">${money(j.estimate)}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--t3);padding:30px">No jobs yet.</td></tr>'}
    </tbody></table></div>
  </div>`;
}

/* ============ JOBS ============ */
let jf={status:'all',brand:'all',payment:'all',q:''};
function renderJobs(){
  let list=jobs.filter(j=>{
    if(jf.status!=='all'&&j.status!==jf.status)return false;
    if(jf.brand!=='all'&&j.brand!==jf.brand)return false;
    if(jf.payment!=='all'&&j.payment!==jf.payment)return false;
    if(jf.q){const q=jf.q.toLowerCase();if(!([j.job_no,j.customer,j.imei,j.model,(j.contacts||[]).join(' ')].join(' ').toLowerCase().includes(q)))return false}
    return true;

function tagPicker(label,ns,arrName,optName){return `<label>${label}</label><div class="tags"><div id="tags_${ns}" style="min-height:6px;margin-bottom:6px"></div><input class="inp" style="border:none;padding:4px 0" placeholder="Search or type to add…" oninput="tagSearch('${ns}','${arrName}','${optName}',this.value)"/><div id="opts_${ns}"></div></div>`}
function renderTags(ns,arrName){const arr=window[arrName];document.getElementById('tags_'+ns).innerHTML=arr.map(t=>`<span class="tag">${esc(t)}<b onclick="removeTag('${ns}','${arrName}','${esc(t).replace(/'/g,"\\'")}')">&times;</b></span>`).join('')}
function tagSearch(ns,arrName,optName,q){const opts=eval(optName);const arr=window[arrName];const box=document.getElementById('opts_'+ns);if(!q){box.innerHTML='';return}const avail=opts.filter(o=>!arr.includes(o)&&o.toLowerCase().includes(q.toLowerCase())).slice(0,6);
  let html=avail.map(o=>`<div class="opt" onclick="addTag('${ns}','${arrName}','${optName}','${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</div>`).join('');
  if(!opts.some(o=>o.toLowerCase()===q.toLowerCase()))html+=`<div class="opt" style="color:var(--volt)" onclick="addNewTag('${ns}','${arrName}','${optName}','${esc(q).replace(/'/g,"\\'")}')">+ Add "${esc(q)}"</div>`;
  box.innerHTML=html;}
function addTag(ns,arrName,optName,v){window[arrName].push(v);renderTags(ns,arrName);document.getElementById('opts_'+ns).innerHTML='';event.target.closest('.tags').querySelector('input').value=''}
function addNewTag(ns,arrName,optName,v){const arr=eval(optName);if(!arr.includes(v)){arr.push(v);save()}addTag(ns,arrName,optName,v)}
function removeTag(ns,arrName,v){window[arrName]=window[arrName].filter(x=>x!==v);renderTags(ns,arrName)}

function sendWA(id){const j=jobs.find(x=>x.id===id);const to=(j.contacts||[])[0];if(!to){toast('No contact number on this job','err');return}

function renderInv(){
  const totProducts=products.length, units=products.reduce((s,p)=>s+(+p.stock||0),0), val=products.reduce((s,p)=>s+(+p.cost||0)*(+p.stock||0),0), low=products.filter(p=>(+p.stock||0)<=(+p.low||3)).length;
  const K=[['📦',totProducts,'Products','var(--cyan)'],['🔢',units,'Units in Stock','var(--volt)'],['💵',money(val),'Stock Value','var(--ok)'],['⚠️',low,'Low Stock','var(--err)']];

    <div class="row2"><div class="field"><label>Shop Name</label><input class="inp" id="s_name" value="${esc(shop.name)}"/></div><div class="field"><label>Tagline</label><input class="inp" id="s_tag" value="${esc(shop.tagline)}"/></div>
    <div class="field"><label>Phone</label><input class="inp" id="s_phone" value="${esc(shop.phone)}"/></div><div class="field"><label>Currency</label><select class="inp" id="s_cur">${Object.entries(CURRENCIES).map(([c,s])=>`<option value="${c}" ${shop.currency===c?'selected':''}>${s} · ${c}</option>`).join('')}</select></div></div>
    <div class="field"><label>Address</label><input class="inp" id="s_addr" value="${esc(shop.address)}"/></div>
  </div>
  <div class="card" style="margin-top:20px;max-width:800px">
    <h3 class="disp" style="font-weight:600;margin-bottom:8px">💬 WhatsApp / SMS Template (Ready for pickup)</h3>
    <p class="mono" style="font-size:11px;color:var(--t3);margin-bottom:12px">Variables: {CUSTOMER} {JOB} {DEVICE} {ESTIMATE} {CUR} {SHOP}</p>
    <textarea class="inp" id="s_wa" rows="3">${esc(shop.wa)}</textarea>
  </div>
  <div class="card" style="margin-top:20px;max-width:800px">
    <h3 class="disp" style="font-weight:600;margin-bottom:8px">🎫 Ticket Footer</h3>
    <textarea class="inp" id="s_footer" rows="2">${esc(shop.footer)}</textarea>
  </div>
  <div class="card" style="margin-top:20px;max-width:800px">
    <h3 class="disp" style="font-weight:600;margin-bottom:12px">💾 Backup & Data</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-s" onclick="backup()">↓ Backup (JSON)</button><button class="btn btn-s" onclick="document.getElementById('restoreFile').click()">↑ Restore</button><input type="file" id="restoreFile" class="hide" accept=".json" onchange="restore(event)"/><button class="btn btn-d" onclick="if(confirm('Erase ALL data in this browser?')){localStorage.clear();location.reload()}">Reset All Data</button></div>
  </div>`;
}
function saveSet(){shop.name=document.getElementById('s_name').value;shop.tagline=document.getElementById('s_tag').value;shop.phone=document.getElementById('s_phone').value;shop.currency=document.getElementById('s_cur').value;shop.address=document.getElementById('s_addr').value;shop.wa=document.getElementById('s_wa').value;shop.footer=document.getElementById('s_footer').value;save();document.getElementById('sideShop').textContent=shop.name;toast('Settings saved');renderSet()}
function backup(){const data={jobs,products,cat,shop};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='techgarage-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup downloaded')}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);jobs=d.jobs||jobs;products=d.products||products;cat=d.cat||cat;shop=d.shop||shop;save();toast('Data restored');go('dash')}catch{toast('Invalid backup file','err')}};r.readAsText(f)}
</script>
</body>
</html>
